<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Partes IRV-10: nueva dirección</title>
<meta http-equiv="refresh" content="4; url=https://irv-10-pro.web.app/IRV-10-PRO/">
<style>
  body{font-family:system-ui,sans-serif;background:#12141c;color:#e8eaf0;text-align:center;padding:48px 16px}
  a{color:#2d9e5f;font-weight:700}
</style>
</head>
<body>
<h2>Partes IRV-10</h2>
<p>La aplicación se ha movido a una dirección nueva.</p>
<p><a href="https://irv-10-pro.web.app/IRV-10-PRO/">Abrir la aplicación</a></p>
<script>
// Quita de este navegador lo que dejó la copia antigua de la app (solo lo de esta ruta: el service worker de /IRV-10-PRO/ y sus cachés
// "irv10-build-…") y lleva a la dirección nueva. No toca nada de la app vieja ni lo guardado en localStorage.
(function(){
  var destino = 'https://irv-10-pro.web.app/IRV-10-PRO/';
  function ir(){ location.replace(destino); }
  try {
    var tareas = [];
    if ('serviceWorker' in navigator) {
      tareas.push(navigator.serviceWorker.getRegistrations().then(function(rs){
        return Promise.all(rs.filter(function(r){ return r.scope.indexOf('/IRV-10-PRO/') >= 0; }).map(function(r){ return r.unregister(); }));
      }));
    }
    if (window.caches) {
      tareas.push(caches.keys().then(function(ks){
        return Promise.all(ks.filter(function(k){ return k.indexOf('irv10-build-') === 0; }).map(function(k){ return caches.delete(k); }));
      }));
    }
    Promise.all(tareas).then(ir, ir);
  } catch (e) { ir(); }
})();
</script>
</body>
</html>
